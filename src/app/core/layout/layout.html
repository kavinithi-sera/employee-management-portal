<mat-sidenav-container class="sidenav-container">

  <mat-sidenav
    #sidenav
    class="sidenav"
    mode="side"
    opened>

    <div class="sidenav-content">

      <div>

        <div class="sidenav-header">

          <mat-icon>
            badge
          </mat-icon>

          <span>
            EMS Portal
          </span>

        </div>


        <mat-nav-list>

          <a
            mat-list-item
            routerLink="/dashboard"
            routerLinkActive="active-link">

            <mat-icon matListItemIcon>
              dashboard
            </mat-icon>

            <span matListItemTitle>
              Dashboard
            </span>

          </a>


          <a
            mat-list-item
            routerLink="/employees"
            routerLinkActive="active-link">

            <mat-icon matListItemIcon>
              groups
            </mat-icon>

            <span matListItemTitle>
              Employees
            </span>

          </a>


          <a
            mat-list-item
            routerLink="/departments"
            routerLinkActive="active-link">

            <mat-icon matListItemIcon>
              business
            </mat-icon>

            <span matListItemTitle>
              Departments
            </span>

          </a>

        </mat-nav-list>

      </div>


      <div class="logout-section">

        <button
          mat-list-item
          type="button"
          class="logout-button"
          (click)="logout()">

          <mat-icon matListItemIcon>
            logout
          </mat-icon>

          <span matListItemTitle>
            Logout
          </span>

        </button>

      </div>

    </div>

  </mat-sidenav>


  <mat-sidenav-content>

    <mat-toolbar class="toolbar">

      <button
        mat-icon-button
        (click)="sidenav.toggle()">

        <mat-icon>menu</mat-icon>

      </button>

      <span>
        Employee Management Portal
      </span>

      <span class="toolbar-spacer"></span>

      <span class="user-name">
        {{ authService.displayName() }}
      </span>

    </mat-toolbar>


    <main class="content">

      <router-outlet />

    </main>

  </mat-sidenav-content>

</mat-sidenav-container>
