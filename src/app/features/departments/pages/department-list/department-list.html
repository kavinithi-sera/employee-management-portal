<div class="department-header">

  <h2>Departments</h2>

  <button
    mat-flat-button
    color="primary"
    (click)="addDepartment()">

    <mat-icon>add</mat-icon>

    Add Department

  </button>

</div>


@if (isLoading()) {

  <p>Loading departments...</p>

} @else if (errorMessage()) {

  <p class="error-message">
    {{ errorMessage() }}
  </p>

} @else {

  <table
    mat-table
    [dataSource]="departments()">


    <!-- ID -->

    <ng-container matColumnDef="id">

      <th
        mat-header-cell
        *matHeaderCellDef>
        ID
      </th>

      <td
        mat-cell
        *matCellDef="let department">

        {{ department.id }}

      </td>

    </ng-container>


    <!-- Name -->

    <ng-container matColumnDef="name">

      <th
        mat-header-cell
        *matHeaderCellDef>
        Department
      </th>

      <td
        mat-cell
        *matCellDef="let department">

        {{ department.name }}

      </td>

    </ng-container>


    <!-- Location -->

    <ng-container matColumnDef="location">

      <th
        mat-header-cell
        *matHeaderCellDef>
        Location
      </th>

      <td
        mat-cell
        *matCellDef="let department">

        {{ department.location }}

      </td>

    </ng-container>


    <!-- Actions -->

    <ng-container matColumnDef="actions">

      <th
        mat-header-cell
        *matHeaderCellDef>
        Actions
      </th>

      <td
        mat-cell
        *matCellDef="let department">

        <button
          mat-icon-button
          color="primary"
          aria-label="Edit department"
          (click)="editDepartment(department)">

          <mat-icon>edit</mat-icon>

        </button>

        <button
          mat-icon-button
          color="warn"
          aria-label="Delete department"
          (click)="deleteDepartment(department)">

          <mat-icon>delete</mat-icon>

        </button>

      </td>

    </ng-container>


    <tr
      mat-header-row
      *matHeaderRowDef="displayedColumns">
    </tr>

    <tr
      mat-row
      *matRowDef="
        let row;
        columns: displayedColumns;
      ">
    </tr>

  </table>

}
